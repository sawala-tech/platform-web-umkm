; php.ini untuk Wasmer Edge (dimuat lewat env PHPRC=/app/php/ di wasmer.toml).

; Upload: validasi aplikasi membatasi logo/foto ke 2 MB (LOGO_MAX_BYTES); batas PHP dibuat sedikit lebih longgar.
upload_max_filesize = 3M
; Galeri: hingga 12 foto x 2 MB dalam satu request (GALLERY_MAX_IMAGES).
post_max_size = 40M

; Sesi: sejalan dengan SESSION_TIMEOUT (1800 detik).
session.gc_maxlifetime = 1800

; Produksi: jangan tampilkan error ke pengunjung.
display_errors = Off
log_errors = On

; Opcache (sesuai contoh resmi Wasmer untuk PHP).
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.max_file_size = 0
